name: Native product checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  local-product:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python scripts/verify_preparation.py --final
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check.mjs
      - run: node scripts/build.mjs
      - name: Verify actual native startup before the full suite
        run: node --experimental-transform-types --test tests/native/native-startup.test.ts
      - run: node scripts/test.mjs
